name: Build and Deploy Flutter Web (to web-deploy branch)

on:
  push:
    branches:
      - main   # change to your main branch name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'  # or specific, e.g. '3.22.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: |
          flutter build web --release

      - name: Deploy build/web to branch web-deploy
        uses: JamesIves/github-pages-deploy-action@v4.4.3
        with:
          branch: web-deploy        # branch to push to (create/overwrite)
          folder: build/web         # folder to push
          clean: true
